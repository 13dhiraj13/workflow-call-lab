name: Error Handling Demo
on:
  push:
jobs:
  error-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 - Success
        run: echo "Step 1 completed successfully"

      - name: Step 2 - Deployment
        run: |
          echo "Starting deployment..."
          exit 1

      - name: Step 3 - Failure Alert
        if: ${{ failure() }}
        run: echo "ALERT: Deployment failed!"

      - name: Step 4 - Cleanup
        if: ${{ always() }}
        run: echo "Cleaning temporary files"
